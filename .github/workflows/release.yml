name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: publish-fork
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:check
      - run: npm run test:unit
      - run: npm run build
      - name: Verify packaged manifest and generate update metadata
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = onirob/zotero-reMarkable-plugin
          cd .scaffold/build
          xpi=zotero-remarkable-sync.xpi
          manifest=$(unzip -p "$xpi" manifest.json)
          version=$(jq -er .version <<<"$manifest")
          test "$GITHUB_REF_NAME" = "v$version"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          channel=update.json
          if [[ "$version" == *-* ]]; then channel=update-beta.json; fi
          jq -e --arg url "$base/release/$channel" '.applications.zotero.update_url == $url' <<<"$manifest"
          id=$(jq -er .applications.zotero.id <<<"$manifest")
          hash=$(sha256sum "$xpi" | cut -d' ' -f1)
          jq -n --arg id "$id" --arg v "$version" --arg url "$base/$GITHUB_REF_NAME/$xpi" --arg hash "sha256:$hash" \
            '{addons:{($id):{updates:[{version:$v,update_link:$url,update_hash:$hash,applications:{zotero:{strict_min_version:"8.0",strict_max_version:"10.0.*"}}}]}}}' > "$channel"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-build
          include-hidden-files: true
          path: |
            .scaffold/build/*.xpi
            .scaffold/build/update*.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-build
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: zotero-remarkable-sync.xpi
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.xpi --verify-tag --generate-notes "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          if ! gh release view release --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release create release --target "$GITHUB_SHA" --title "Plugin updates" --notes "Update manifests for this fork." --latest=false --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload release update*.json --clobber --repo "$GITHUB_REPOSITORY"
